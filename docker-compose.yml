services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:
    image: postgres:17
    container_name: nexusflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: nexusflow
      POSTGRES_USER: nexusflow
      POSTGRES_PASSWORD: nexusflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nexusflow -d nexusflow" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================
  # Redis
  # ==========================================================

  redis:
    image: redis:8-alpine
    container_name: nexusflow-redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================
  # RabbitMQ 4.3
  # ==========================================================

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: nexusflow-rabbitmq
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================================
  # Database migration
  #
  # Runs BEFORE API / worker / beat.
  # ==========================================================

  migrate:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexusflow-migrate

    restart: "no"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    command: [ "alembic", "upgrade", "head" ]

  # ==========================================================
  # FastAPI
  # ==========================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexusflow-api

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      migrate:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    ports:
      - "8000:8000"

    command: [ "uvicorn", "nexusflow.main:app", "--host", "0.0.0.0", "--port", "8000" ]

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # Celery Worker
  # ==========================================================

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexusflow-worker

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      migrate:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    command: [ "celery", "-A", "nexusflow.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2" ]

  # ==========================================================
  # Celery Beat
  # ==========================================================

  beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexusflow-beat

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      migrate:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    volumes:
      - beat_data:/var/lib/nexusflow

    command: [ "celery", "-A", "nexusflow.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/var/lib/nexusflow/celerybeat-schedule" ]

# ============================================================
# Volumes
# ============================================================

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  beat_data:
